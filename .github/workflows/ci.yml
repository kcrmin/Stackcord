name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_scope.py --base "$BASE" --head "$HEAD"

  native:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
            artifact: stackcord-darwin-arm64
            extension: ""
          - name: Windows x64
            os: windows-2025
            artifact: stackcord-windows-amd64
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - name: Core library tests and static analysis
        working-directory: core
        run: go test ./... && go vet ./...
      - name: Unit and integration tests
        working-directory: cli
        run: go test ./...
      - name: Static analysis
        working-directory: cli
        run: go vet ./...
      - name: Native build and smoke test
        shell: bash
        run: |
          mkdir -p dist
          cd cli
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o "../dist/stackcord${{ matrix.extension }}" ./cmd/stackcord
          "../dist/stackcord${{ matrix.extension }}" doctor --json
          "../dist/stackcord${{ matrix.extension }}" context audit --root ../examples/starter --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/stackcord${{ matrix.extension }}
          if-no-files-found: error

  repository-contracts:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Plugin, documentation, security, and strict-profile contracts
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m unittest \
            validate_plugin_test \
            validate_docs_test \
            validate_agent_eval_test \
            bootstrap_cli_test \
            render_plugin_packages_test \
            security_scan_test \
            validate_release_config_test \
            validate_ci_test \
            ci_scope_test \
            release_preflight_test \
            -v
          python3 scripts/validate_plugin.py .
          python3 scripts/validate_agent_eval.py .
          python3 scripts/validate_docs.py
          python3 scripts/security_scan.py .
          python3 scripts/validate_release_config.py .
          python3 -m unittest discover -s evals/baseline -p '*_test.py' -v
          python3 -m unittest discover -s profiles/strict-release/scripts -p '*_test.py' -v
      - name: Coordination race checks
        if: needs.changes.outputs.full == 'true'
        working-directory: core
        run: go test -race ./coordination ./httpapi
      - name: Console behavior
        run: node --test cli/internal/console/console.test.cjs
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Shared channel, control center and HTTP server race checks
        if: needs.changes.outputs.full == 'true'
        working-directory: cli
        run: go test -race ./internal/harness/channel ./internal/harness/dashboard ./internal/harness/controlcenter ./internal/runtimecmd ./internal/console
      - name: GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: check

  product-dogfood:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Multi-repository service continuity scenario
        env:
          STACKCORD_RUN_DOGFOOD: "1"
        run: |
          bash dogfood/run.sh --output "$RUNNER_TEMP/dogfood.json" --workspace "$RUNNER_TEMP/dogfood-workspace"
          python3 evals/baseline/score.py \
            --scenarios evals/baseline/scenarios.yaml \
            --dogfood "$RUNNER_TEMP/dogfood.json" \
            --output-json "$RUNNER_TEMP/baseline.json" \
            --output-markdown "$RUNNER_TEMP/report.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: service-continuity-dogfood
          path: |
            ${{ runner.temp }}/dogfood.json
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/report.md
          if-no-files-found: error

  cross-build:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.6
          cache-dependency-path: |
            core/go.sum
            cli/go.sum
      - name: Build all supported targets without CGO
        shell: bash
        run: |
          mkdir -p dist
          cd cli
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=ci" -o "../dist/stackcord_${os}_${arch}${ext}" ./cmd/stackcord
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-builds
          path: dist/
          if-no-files-found: error

  required-gate:
    name: CI gate
    if: always()
    needs: [changes, repository-contracts, native, product-dogfood, cross-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Require successful checks for the selected scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py --gate
